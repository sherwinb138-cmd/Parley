# Pings the hosted app every 2 days so the free Supabase project stays active through judging.
# Set the repository variable APP_URL (Settings -> Secrets and variables -> Actions -> Variables)
# to the Render URL, for example https://parley.onrender.com
name: keepalive
on:
  schedule:
    - cron: "0 3 */2 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health route
        run: |
          if [ -z "${{ vars.APP_URL }}" ]; then echo "APP_URL variable is not set"; exit 1; fi
          curl --fail --silent --show-error --max-time 60 "${{ vars.APP_URL }}/api/health"
